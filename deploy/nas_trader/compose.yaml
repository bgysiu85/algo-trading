# Paper IB Gateway for the NAS trader (W10-0013 sub 4). Project "trader" = the second of the three NAS projects
# (trade-journal | trader | edge, decided 2026-10-28, sub 14). Sub 4 added the Gateway, sub 5 the trader service (profile
# "trade", dry by default); sub 11 adds the portal relay. Setup guide: deploy/nas_trader/NAS-TRADER-SETUP.md
#
# The API is NOT published anywhere - not on the home network, not on the NAS's loopback. Rules a later chat must not undo:
#   * The paper API (unauthenticated, orders allowed) is reachable only from containers that share this container's
#     network: the trader (sub 5, network_mode: "container:trader-ib-gateway"), and one-off jobs (the probe, the W18 desk's
#     data script) join it with  --network container:trader-ib-gateway.
#   * Why not 127.0.0.1:4002 on the NAS either: the NAS runs Tailscale in userspace mode, which hands every tailnet
#     connection to the NAS's 127.0.0.1 (W17-0024 step 4 found 127.0.0.1:5900 and :5432 open that way). A loopback
#     publish of the API would therefore be reachable by every device on the tailnet. Never publish it at all.
#   * The trader refuses every port except 4002/7497. Inside the Gateway's network the Gateway itself listens on
#     4002; gnzsnz's socat relay on 4004 exists for OTHER containers and is the wrong port for the trader.
#   * One IBKR username = one session. The PC's paper Gateway and the ProArt trader must be OFF while this runs.
name: trader

services:
  ib-gateway:
    # Same gnzsnz image and pin as the recorder's Gateway (set IB_GATEWAY_IMAGE in .env to the digest in
    # /volume1/docker/trade-journal/.env). A different username, so a second Gateway is needed.
    image: ${IB_GATEWAY_IMAGE:-ghcr.io/gnzsnz/ib-gateway:stable}
    container_name: trader-ib-gateway           # fixed name: probe and one-off jobs join it with  --network container:trader-ib-gateway
    platform: linux/amd64
    restart: always
    security_opt:
      - seccomp:unconfined                      # Synology's kernel has no seccomp; without this containers fail to start
    environment:
      TWS_USERID: ${TWS_USERID:?set TWS_USERID in .env}          # the PAPER username
      TWS_PASSWORD: ${TWS_PASSWORD:?set TWS_PASSWORD in .env}
      TRADING_MODE: paper
      READ_ONLY_API: "no"                       # the trader places orders; "yes" makes IBKR reject every one (audit risk B)
      # Daily restart in the middle of the CME break (16:00-17:00 Chicago), as on the recorder's Gateway. A daily restart
      # needs no new approval. Sub 6/9 confirm the trader's session hours fit around it.
      TIME_ZONE: America/Chicago
      TZ: America/Chicago
      AUTO_RESTART_TIME: "04:30 PM"
      TWOFA_TIMEOUT_ACTION: restart             # an unapproved login prompt is retried, not left dead (paper logins normally have none)
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:?set VNC_SERVER_PASSWORD in .env}
      TWS_SETTINGS_PATH: /home/ibgateway/tws_settings
    volumes:
      - ${GATEWAY_SETTINGS_DIR:-/volume1/trader/gateway}:/home/ibgateway/tws_settings
    ports:
      # Only the login screen (VNC), NAS loopback only, like the recorder's. 5901 because the recorder's Gateway already
      # holds 5900. It is password-protected, but note the Tailscale point above: the tailnet reaches it (W10-0013 sub 7
      # reviews the recorder's 5900 and this one together). The API is deliberately not listed here.
      - "127.0.0.1:${VNC_HOST_PORT:-5901}:5900"
    healthcheck:
      # Healthy while the Gateway's own API socket (4002) accepts a connection, i.e. logged in and API on. Docker only
      # flags it; nothing restarts on "unhealthy" here (alerts for this come with W10-0013 sub 12).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4002"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  trader:
    # The trader (W10-0013 sub 5). Plain python image + three folders mounted in, because Synology cannot run a RUN step
    # in a build: /app = the code (from build_release.py), /deps = the pinned packages (installed once with a plain
    # docker run), /app/var = the trader's state and fills. Steps: NAS-TRADER-SETUP.md part 2.
    image: ${TRADER_IMAGE:-python:3.12-slim}
    container_name: trader-trader
    platform: linux/amd64
    # SHARES the Gateway's network, so it sees the Gateway on 127.0.0.1:4002 (the only port it accepts) and the API is
    # still published nowhere. Anything the trader needs published would have to be listed on ib-gateway, not here.
    # "container:<fixed name>" and not "service:ib-gateway": with  up --no-deps  the NAS's docker compose passed
    # "service:ib-gateway" straight to the daemon ("network service:ib-gateway not found", measured 2026-10-28).
    # The Gateway's container_name is fixed, so the name always resolves; the daemon does the lookup at start.
    network_mode: "container:trader-ib-gateway"
    depends_on:
      ib-gateway:
        condition: service_healthy
    # NEVER starts with the project: it is in profile "trade", which COMPOSE_PROFILES does not list. Started on purpose
    # (sub 9 puts that in a DSM scheduled task):  docker compose --profile trade up -d --no-deps trader
    profiles: ["trade"]
    # A session ends by itself at the close; restarting it would start a second session. No restart policy.
    restart: "no"
    user: "1000:1000"                           # the owner of the NAS folders (same as the Gateway's settings folder)
    init: true
    stop_grace_period: 90s                      # SIGTERM = the trader's own graceful stop (it flattens its book view and writes the fill log)
    security_opt:
      - seccomp:unconfined                      # Synology's kernel has no seccomp
    working_dir: /app                           # var/ is resolved against the working directory (audit item 5)
    command: ["python", "/app/run_trader.py"]
    environment:
      PYTHONPATH: /deps
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: America/New_York
      # What to run. dry = no orders. paper = real orders on the PAPER account; changing it is the cutover decision (sub 9).
      TRADER_MODE: ${TRADER_MODE:-dry}
      TRADER_STRATEGY: ${TRADER_STRATEGY:-mcl}
      TRADER_MAX_POSITIONS: ${TRADER_MAX_POSITIONS:-}
      TRADER_CAP_SCOPE: ${TRADER_CAP_SCOPE:-}
      TRADER_TELEGRAM_BATCH_MIN: ${TRADER_TELEGRAM_BATCH_MIN:-0}
      TRADER_FEED: ${TRADER_FEED:-on}
      # Optional secrets; empty = that feature is off. Never baked into an image or a file in the repo.
      TV_SESSIONID: ${TV_SESSIONID:-}
      TV_SESSIONID_SIGN: ${TV_SESSIONID_SIGN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      UI_RELAY_URL: ${UI_RELAY_URL:-}
      UI_AGENT_TOKEN: ${UI_AGENT_TOKEN:-}
      UI_AGENT_ID: ${UI_AGENT_ID:-nas-trader}   # explicit: the default is the container's hostname
    volumes:
      - ${TRADER_APP_DIR:-/volume1/docker/trader/app}:/app:ro
      - ${TRADER_DEPS_DIR:-/volume1/docker/trader/deps}:/deps:ro
      - ${TRADER_VAR_DIR:-/volume1/trader-data/var}:/app/var
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  relay:
    # The portal relay (W10-0013 sub 11): the FastAPI app from the Trading UI repo (D:\Trading UI), served at
    # https://trader.thesiuz.com through the tunnel in the "edge" project (sub 15). Same pattern as the trader: plain python
    # image + folders mounted in (Synology cannot run a RUN step in a build): /srv = app/ contract/ history/, /deps = the
    # pinned packages. Steps: NAS-TRADER-SETUP.md part 5.
    #   * ONLY on the external network thesiuz-edge (created by the edge project): reachable by the tunnel, and by
    #     journal-login, but NOT on this project's default network and not in the Gateway's network. It cannot reach the
    #     paper API, and the trader (which shares the Gateway's network) pushes to the public https address instead.
    #   * Publishes no port. Exactly one instance: it keeps the last pushed state in memory (a second copy breaks the portal).
    #   * Never starts with the project (profile "portal"); started on purpose:
    #       docker compose --profile portal up -d --no-deps relay      (--no-deps: the Gateway and trader are not touched)
    #   * Browser login is Pocket ID (OIDC). With the OIDC settings empty the relay refuses everything but localhost, so a
    #     half-configured relay is closed, not open. The trader pushes with the agent token (UI_AGENT_TOKEN, same value).
    profiles: ["portal"]
    image: ${RELAY_IMAGE:-python:3.12-slim}
    container_name: trader-relay
    platform: linux/amd64
    restart: always
    user: "1000:1000"
    init: true
    security_opt:
      - seccomp:unconfined                      # Synology's kernel has no seccomp
    working_dir: /srv
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      PYTHONPATH: /deps
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      LANG: C.UTF-8
      TRADER_UI_STALE_AFTER: "30"
      TRADER_UI_AGENT_TOKEN: ${UI_AGENT_TOKEN:-}                    # the trader's token (one value, two names)
      UI_BASE_URL: https://trader.thesiuz.com                       # the OIDC callback is built from it; https = secure cookies
      OIDC_ISSUER: ${RELAY_OIDC_ISSUER:-https://id.thesiuz.com}
      OIDC_CLIENT_ID: ${RELAY_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${RELAY_OIDC_CLIENT_SECRET:-}
      TRADER_UI_SESSION_SECRET: ${RELAY_SESSION_SECRET:-}
      ALLOWED_SUBJECTS: ${RELAY_ALLOWED_SUBJECTS:-}
      DATABASE_URL: ${RELAY_DATABASE_URL:-}                         # Neon until sub 13 moves the history to the NAS Postgres
    volumes:
      - ${RELAY_APP_DIR:-/volume1/docker/trader/relay/srv}:/srv:ro
      - ${RELAY_DEPS_DIR:-/volume1/docker/trader/relay/deps}:/deps:ro
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  watch:
    # Outside dead-man ping + portal and trader health checks (W10-0013 sub 12), deploy/nas_trader/watch.py. Once a minute:
    # pings healthchecks.io (HC_PING_URL; silence there = the NAS is down), checks https://trader.thesiuz.com answers, and in
    # the trader's window (04:10-09:25 New York, weekdays) that the session lock's heartbeat is fresh. Messages Telegram.
    #   * Own default network only: not in the Gateway's network, not on thesiuz-edge, no ports. Reads var/ READ-ONLY.
    #   * Never starts with the project (profile "watch"):  docker compose --profile watch up -d --no-deps watch
    profiles: ["watch"]
    image: ${WATCH_IMAGE:-python:3.12-slim}
    container_name: trader-watch
    platform: linux/amd64
    restart: always
    user: "${PUID:-1026}:${PGID:-100}"
    init: true
    security_opt:
      - seccomp:unconfined                      # Synology's kernel has no seccomp
    command: ["python", "/watch/watch.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      HC_PING_URL: ${HC_PING_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      WATCH_SKIP_DATES: ${WATCH_SKIP_DATES:-}
    volumes:
      - ${WATCH_DIR:-/volume1/docker/trader/watch}:/watch:ro
      - ${TRADER_VAR_DIR:-/volume1/trader-data/var}:/var-data:ro
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

networks:
  edge:
    # Created by the edge project (deploy/nas_edge). External here, so this project never creates or removes it.
    name: thesiuz-edge
    external: true
